<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <!-- Master Rounded Rectangle Geometry -->
        <rect id="rect-geom" x="40" y="70" width="120" height="60" rx="15" />
    </defs>

    <!-- 1. Extrusion Side Walls (Shifted down, connecting bottom contour) -->
    <g transform="translate(0, 20)">
        <use href="#rect-geom" fill="#00FF00" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" />
    </g>

    <!-- 2. Solid Opaque Top Face Lid (Completely covers extrusion to prevent show-through) -->
    <use href="#rect-geom" fill="#FF0000" />

    <!-- 3. Crisp Outlines & Structural Lines -->
    <use href="#rect-geom" fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" />
    <path fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" d="M 40,115 L 40,135 A 15,15 0 0,0 55,150 L 145,150 A 15,15 0 0,0 160,135 L 160,115" />
</svg>
