<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <!-- Master Hexagon Path Geometry -->
        <polygon id="hex-geom" points="70,60 130,60 160,100 130,140 70,140 40,100" />

        <!-- Clip Path to prevent any bottom bleed-through -->
        <clipPath id="hex-top-clip">
            <use href="#hex-geom" />
        </clipPath>
    </defs>

    <!-- 1. Solid 3D Side Walls & Extrusion (Shifted downward) -->
    <g transform="translate(0, 20)">
        <use href="#hex-geom" fill="#00FF00" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" />
    </g>

    <!-- 2. Individual Side Shading & Connectors for Depth Detail -->
    <!-- Left Side Dark Shadow -->
    <polygon fill="#0000FF" points="40,100 70,140 70,160 40,120" />
    <!-- Center Side Light Shadow -->
    <polygon fill="#00FF00" points="70,140 130,140 130,160 70,160" />
    <!-- Right Side Light Shadow -->
    <polygon fill="#00FF00" points="130,140 160,100 160,120 130,160" />

    <!-- 3. Top Face Layer (Strictly clipped to the exact contour bounds) -->
    <use href="#hex-geom" fill="#FF0000" clip-path="url(#hex-top-clip)" />

    <!-- 4. Crisp Outlines & Structural Lines -->
    <use href="#hex-geom" fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" />
    <path fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" d="M 40,100 L 40,120 L 70,160 L 130,160 L 160,120 L 160,100" />
    <line fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" x1="70" y1="140" x2="70" y2="160" />
    <line fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" x1="130" y1="140" x2="130" y2="160" />
</svg>

