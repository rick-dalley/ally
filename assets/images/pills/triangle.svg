<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <!-- Master True Equilateral/Isosceles Triangle Geometry -->
        <polygon id="true-tri" points="100,45 160,150 40,150" />
    </defs>

    <!-- 1. Bottom Extrusion Base (All Blue Side Walls) -->
    <path fill="#0000FF" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" d="M 40,150 L 40,175 L 160,175 L 160,150 Z" />

    <!-- 2. Solid Opaque Top Face Lid (Completely covers extrusion to prevent show-through) -->
    <use href="#true-tri" fill="#FF0000" />

    <!-- 3. Crisp Outlines -->
    <use href="#true-tri" fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" />
    <path fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" d="M 40,150 L 40,175 L 160,175 L 160,150" />
</svg>
