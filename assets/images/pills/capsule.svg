<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <g transform="rotate(-30 100 100)">
        <!-- Side Shadow -->
        <rect fill="#00FF00" x="40" y="80" width="120" height="40" rx="20" transform="translate(0, 20)" />
        <!-- Top Face -->
        <rect fill="#FF0000" x="40" y="80" width="120" height="40" rx="20" />
        <!-- Center Join Line (For two-tone capsules) -->
        <line fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" x1="100" y1="80" x2="100" y2="120" />
        <!-- Outlines -->
        <rect fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" x="40" y="80" width="120" height="40" rx="20" />
        <path fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" d="M 40,100 L 40,120 A 20,20 0 0,0 60,140 L 140,140 A 20,20 0 0,0 160,120 L 160,100" />
    </g>
</svg>

