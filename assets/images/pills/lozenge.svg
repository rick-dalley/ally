<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <!-- Master Leaf/Shield Path Geometry -->
        <path id="leaf-geom" d="M 100,50 C 130,70 160,80 170,100 C 140,120 120,130 100,150 C 80,130 60,120 30,100 C 40,80 70,70 100,50 Z" />

        <!-- Clip Path to prevent any bottom bleed-through -->
        <clipPath id="leaf-top-clip">
            <use href="#leaf-geom" />
        </clipPath>
    </defs>

    <!-- 1. Solid 3D Side Walls & Extrusion Base (Shifted downward) -->
    <g transform="translate(0, 20)">
        <use href="#leaf-geom" fill="#00FF00" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" />
    </g>

    <!-- 2. Individual Side Shading & Connectors for Depth Detail -->
    <!-- Left Extrusion -->
    <path fill="#0000FF" d="M 30,100 L 100,150 L 100,170 L 30,120 Z" />
    <!-- Right Extrusion -->
    <path fill="#00FF00" d="M 100,150 L 170,100 L 170,120 L 100,170 Z" />

    <!-- 3. Top Face Layer (Strictly clipped to the exact contour bounds) -->
    <use href="#leaf-geom" fill="#FF0000" clip-path="url(#leaf-top-clip)" />

    <!-- 4. Crisp Outlines & Structural Lines -->
    <use href="#leaf-geom" fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" />
    <path fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" d="M 30,100 L 30,120 L 100,170 L 170,120 L 170,100" />
    <line fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" x1="100" y1="150" x2="100" y2="170" />
</svg>
