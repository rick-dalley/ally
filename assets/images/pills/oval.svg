<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <!-- Master Shape Geometry -->
        <path id="pill-geom" d="M 30,100 C 30,70 60,70 100,70 C 140,70 170,70 170,100 C 170,130 140,130 100,130 C 60,130 30,130 30,100 Z" />
    </defs>

    <!-- 1. Side Walls / Extrusion Skirt (Drawn behind, only outer boundary visible) -->
    <path fill="#00FF00" d="M 30,100 L 30,120 C 30,150 60,150 100,150 C 140,150 170,150 170,120 L 170,100 Z" />

    <!-- 2. Solid Opaque Top Face Lid (Completely covers any interior overlaps) -->
    <use href="#pill-geom" fill="#FF0000" />

    <!-- 3. Crisp Outlines -->
    <path fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" d="M 30,120 C 30,150 60,150 100,150 C 140,150 170,150 170,120" />
    <path fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" d="M 30,100 L 30,120" />
    <path fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" d="M 170,100 L 170,120" />
    <use href="#pill-geom" fill="none" stroke="#FF00FF" stroke-width="4" stroke-linejoin="round" />
</svg>

