<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#2a3240" />
            <stop offset="100%" stop-color="#11151c" />
        </radialGradient>

        <!-- Drop Shadow for 3D Tableted Pill -->
        <filter id="pill-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
            <feOffset dx="0" dy="24" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.55" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Crisp White Tablet Body Gradient (Subtle warm/cool porcelain tones) -->
        <linearGradient id="tablet-base" x1="20%" y1="10%" x2="80%" y2="90%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#f4f6f9" />
            <stop offset="85%" stop-color="#dde3ed" />
            <stop offset="100%" stop-color="#bec8d7" />
        </linearGradient>

        <!-- 3D Cylindrical / Domed Surface Shading Overlay -->
        <radialGradient id="surface-shading" cx="42% " cy="35%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
            <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.0" />
            <stop offset="100%" stop-color="#475569" stop-opacity="0.3" />
        </radialGradient>

        <!-- Beveled Edge Highlight (Top Rim) -->
        <linearGradient id="rim-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>

        <!-- Center Groove (Score Line) Shading & Depth -->
        <linearGradient id="groove-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#b0becf" stop-opacity="0.9" />
            <stop offset="35%" stop-color="#64748b" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#1e293b" stop-opacity="0.95" />
            <stop offset="65%" stop-color="#64748b" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9" />
        </linearGradient>

        <!-- Glossy Specular Highlights -->
        <linearGradient id="specular-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bg-grad)" />

    <!-- Ambient Glow -->
    <circle cx="250" cy="240" r="130" fill="#64748b" opacity="0.2" filter="blur(35px)" />

    <!-- Main Tablet Group (Rotated 3D Angle) -->
    <g filter="url(#pill-shadow)" transform="rotate(-20 250 250)">

        <!-- Outer Rim / Bevel Layer (Creates Thickness/Depth) -->
        <ellipse cx="250" cy="255" rx="140" ry="120" fill="#94a3b8" />
        <ellipse cx="250" cy="253" rx="140" ry="120" fill="#cbd5e1" />

        <!-- Main White Tablet Face -->
        <ellipse cx="250" cy="250" rx="140" ry="120" fill="url(#tablet-base)" />

        <!-- Surface Volume Shading -->
        <ellipse cx="250" cy="250" rx="140" ry="120" fill="url(#surface-shading)" />

        <!-- Beveled Edge Ring Highlight -->
        <ellipse cx="250" cy="248" rx="136" ry="116" fill="none" stroke="url(#rim-highlight)" stroke-width="3.5" opacity="0.9" />

        <!-- Center Groove (Score Line) across the Tablet -->
        <g>
            <!-- Deepest Central Crack -->
            <path d="M 116 250 Q 250 242 384 250 Q 250 258 116 250 Z" fill="#0f172a" opacity="0.9" />

            <!-- Soft Groove Slopes -->
            <path d="M 114 246 Q 250 238 386 246 L 386 250 Q 250 242 114 250 Z" fill="url(#groove-shadow)" />
            <path d="M 114 250 L 386 250 Q 250 262 114 250 Z" fill="#475569" opacity="0.4" />

            <!-- Groove Lip Highlight (Top Edge of Cut) -->
            <path d="M 116 245 Q 250 237 384 245" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />
            <!-- Groove Bottom Edge Shadow -->
            <path d="M 116 255 Q 250 263 384 255" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.7" />
        </g>

        <!-- Primary Glossy Highlight on Upper Surface -->
        <ellipse cx="200" cy="175" rx="65" ry="28" transform="rotate(-10 200 175)" fill="url(#specular-grad)" opacity="0.75" />

        <!-- Secondary Soft Highlight Spot -->
        <ellipse cx="175" cy="160" rx="22" ry="10" transform="rotate(-5 175 160)" fill="#ffffff" opacity="0.85" filter="blur(1px)" />

        <!-- Subtle Bottom Counter-Reflection -->
        <path d="M 130 300 Q 250 365 370 300 Q 250 340 130 300 Z" fill="#ffffff" opacity="0.25" filter="blur(2px)" />
    </g>

    <!-- Contact Ground Shadow -->
    <ellipse cx="250" cy="415" rx="110" ry="16" fill="#000000" opacity="0.45" filter="blur(14px)" />
</svg>
