name: ally
description: "CWICare Ally — on-device patient health tracking and caregiver companion app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_symbols_icons: ^4.2928.1
  http: ^1.2.1
  sqflite: ^2.3.3+1
  url_launcher: ^6.3.0
  path: ^1.9.0
  uuid: ^4.4.0
  permission_handler: ^13.0.0
  geolocator: ^13.0.0
  camera: ^0.12.0+1
  qr_flutter: ^4.1.0
  # speech_to_text: ^7.4.0
  google_mlkit_text_recognition: ^0.16.0
  google_mlkit_barcode_scanning: ^0.15.0
  path_provider: ^2.1.3
  fl_chart: ^1.2.0
  csv: ^6.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.0
  image_picker: ^1.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  flutter_contacts: ^2.1.0
  carbon_ui:
    path: ../carbon_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The core SQLite engine for Flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/CWICareLogo.png"
  # Without these, iOS 18+'s Dark/Tinted home-screen icon appearances get
  # auto-generated from the opaque main icon — an algorithmic desaturation
  # that reads as muddy. Supplying real transparent-background artwork lets
  # iOS composite Dark on its own dark backing and derive Tinted properly.
  image_path_ios_dark_transparent: "assets/images/CWICareLogo_transparent.png"
  image_path_ios_tinted_grayscale: "assets/images/CWICareLogo_transparent.png"
  desaturate_tinted_to_grayscale_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/assessment/
    - assets/conditions/
    - assets/drugs/
    - assets/images/
    - assets/images/pills/
    - assets/interactions/
    - assets/medications/
    - assets/metrics/
    - assets/observations/
    - assets/patients/
    - assets/process/
    - assets/providers/
    - assets/questionnaires/
    - assets/questions/
    - assets/sql/
    - assets/tests/
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans[wdth,wght].ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans[wdth,wght].ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans[wdth,wght].ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans[wdth,wght].ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit[wght].ttf
          weight: 400
        - asset: assets/fonts/Outfit[wght].ttf
          weight: 700
    - family: Inclusive Sans
      fonts:
        - asset: assets/fonts/InclusiveSans-Regular.ttf
          weight: 400

flutter_intl:
  enabled: true

dependency_overrides:
  # permission_handler 13.0.0's constraint is loose enough that pub resolves
  # permission_handler_android to 14.0.0, whose build.gradle.kts references AGP 9.0.1 /
  # Kotlin 2.3.20 / compileSdk 37 in a buildscript{} block but never actually applies the
  # Kotlin Gradle plugin via plugins{} — so its own `kotlin { compilerOptions {} }` block
  # fails to resolve and the Android build breaks. 13.0.1 is the version actually aligned
  # with permission_handler 13.x and builds cleanly.
  permission_handler_android: 13.0.1
