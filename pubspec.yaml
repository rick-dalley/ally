name: ally
description: "CWICare Ally — on-device patient health tracking and caregiver companion app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The build number must increase with every build handed to anyone — Play rejects a
# repeat, and a sideloaded APK won't upgrade in place without it. Bumped for the first
# build that carries the life-event schema (schemaVersion 11), so the beta's first
# update is also the first real exercise of onUpgrade.
version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_symbols_icons: ^4.2928.1
  http: ^1.2.1
  sqflite: ^2.3.3+1
  url_launcher: ^6.3.0
  path: ^1.9.0
  uuid: ^4.4.0
  geolocator: ^13.0.0
  qr_flutter: ^4.1.0
  # speech_to_text: ^7.4.0
  path_provider: ^2.1.3
  fl_chart: ^1.2.0
  csv: ^6.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.0
  image_picker: ^1.2.2
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^12.0.2
  flutter_contacts: ^2.1.0
  app_links: ^6.4.0
  shared_preferences: ^2.3.2
  carbon_ui:
    path: ../carbon_ui
  # FDA-label interaction data and lookups, shared with Acuitage and Progressor.
  cwicare_interactions:
    path: ../cwicare_interactions

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The core SQLite engine for Flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.7+1

flutter_launcher_icons:
  android: true
  ios: true
  # Regenerate these three with `python3 tool/make_app_icon.py` — they are drawn
  # from the same geometry as carbon_ui's JourneyMark widget, so the icon and the
  # startup screen can never drift apart.
  image_path: "assets/icon/ally_icon.png"
  # Without these, iOS 18+'s Dark/Tinted home-screen icon appearances get
  # auto-generated from the opaque main icon — an algorithmic desaturation
  # that reads as muddy. Supplying real transparent-background artwork lets
  # iOS composite Dark on its own dark backing and derive Tinted properly.
  image_path_ios_dark_transparent: "assets/icon/ally_icon_transparent.png"
  image_path_ios_tinted_grayscale: "assets/icon/ally_icon_grayscale.png"
  desaturate_tinted_to_grayscale_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/assessment/
    - assets/conditions/
    - assets/drugs/
    - assets/images/
    - assets/images/pills/
    - assets/medications/
    - assets/metrics/
    - assets/observations/
    - assets/patients/
    - assets/process/
    - assets/providers/
    - assets/questionnaires/
    - assets/questions/
    - assets/sql/
    - assets/tests/
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans[wdth,wght].ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans[wdth,wght].ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans[wdth,wght].ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans[wdth,wght].ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit[wght].ttf
          weight: 400
        - asset: assets/fonts/Outfit[wght].ttf
          weight: 700
    - family: Inclusive Sans
      fonts:
        - asset: assets/fonts/InclusiveSans-Regular.ttf
          weight: 400

flutter_intl:
  enabled: true

dependency_overrides:
  # Ally doesn't use permission_handler itself, but carbon_ui does, so it's still in the
  # build. Its loose constraint lets pub pick permission_handler_android 14.x, whose
  # build.gradle.kts references AGP 9 / compileSdk 37 without applying the Kotlin Gradle
  # plugin, and the Android build breaks. 13.0.1 is the version aligned with
  # permission_handler 13.x and builds cleanly.
  permission_handler_android: 13.0.1
